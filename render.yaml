services:
  - type: web
    name: papertale-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GCP_PROJECT_ID
        value: papertale-studio
      - key: GCS_BUCKET
        value: papertale-studio-assets
      - key: REQUIRE_AUTH
        value: "true"
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: NEXT_PUBLIC_PAYPAL_ENV
        value: sandbox
      - key: LULU_ENVIRONMENT
        value: sandbox
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-lite-image
      - key: GEMINI_COVER_IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: papertale-studio.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: papertale-studio
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: 1:5293527863:web:94db514e7357b587b280b2
      - key: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
        value: 6LfT6B4uAAAAAP7QM-y1GxotSblRzRmgxbF6hFkj
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LULU_CLIENT_KEY
        sync: false
      - key: LULU_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GCP_SERVICE_ACCOUNT_JSON
        sync: false
